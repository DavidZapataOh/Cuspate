[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]

# Forced, not preferred: Uniswap v4-core pins this compiler exactly, not as a range.
solc = "0.8.26"
# Setting the version does not by itself stop detection.
auto_detect_solc = false

# Transient storage, MCOPY and PUSH0 all respond on the target network. This is a
# deliberate step down from the toolchain default, which is a later fork.
evm_version = "cancun"
# What actually selects the target network's execution semantics. evm_version alone
# does not: the same test costs materially different gas with and without this.
network = "monad"

# Keeps the metadata hash out of the deployed bytecode, so verification compares
# code rather than a digest of build inputs.
bytecode_hash = "none"
auto_detect_remappings = false

# Pinned rather than relied upon. Measured: this setting is worth about 29,000 gas and the
# network setting about another 25,000, so every gas number in this repository is comparable
# only against others taken under the same pair of these two.
isolate = true

# Granted on the directory, not on a file: the filename is derived from the chain id, so
# a file-scoped grant silently fails to cover every other chain. The first thing to fail
# without this is a read during the key-existence check, not a write.
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[lint]
# Linting is a gate, not a build-time surprise.
lint_on_build = false

[fmt]
# The formatter's path set must reach contracts/test/, which is the only Solidity
# in the repository while src/ is deliberately absent.
line_length = 100
tab_width = 4

# Aliases, never URLs, are what scripts and documents name. The archive entry is not a
# third network: it is a second door to the production chain, for reads deeper than the
# default endpoint serves.
[rpc_endpoints]
local = "${LOCAL_RPC_URL}"
monad = "${MONAD_RPC_URL}"
monad_testnet = "${MONAD_TESTNET_RPC_URL}"
monad_archive = "https://rpc-mainnet.monadinfra.com"

# Stated explicitly rather than inherited. The number is deliberately not the tool's default,
# so that a section which stops applying is visible as a disagreement rather than hidden by a
# default that happens to match. A later plan may raise it and may not lower it.
[fuzz]
runs = 512

# The reason this configuration exists at all. Measured without it: a campaign attempted 128,000
# calls, 54,969 of them reverted, and the result was a pass with exit zero — so a campaign whose
# every call is refused establishes nothing and reports success. Refusing on a revert is what
# makes a campaign's green mean something.
[invariant]
fail_on_revert = true
runs = 128
depth = 256
