# The CRE project's targets. One: Monad mainnet, where the market's resolver lives. The RPC is read
# from the environment, never committed.
monad-mainnet:
  rpcs:
    - chain-name: monad-mainnet
      url: ${MONAD_RPC_URL}
# The end-to-end run's local chain, whose id is the production chain's. Localhost only.
local-e2e:
  rpcs:
    - chain-name: monad-mainnet
      url: ${LOCAL_E2E_RPC_URL}
# The public test network, where the rehearsal markets live. Its RPC is read from the environment too.
monad-testnet:
  rpcs:
    - chain-name: monad-testnet
      url: ${MONAD_TESTNET_RPC_URL}
# The end-to-end run on a local chain whose id is the test network's. Localhost only.
local-e2e-testnet:
  rpcs:
    - chain-name: monad-testnet
      url: ${LOCAL_E2E_RPC_URL}
